name: Signaler un bug
description: Décrire un comportement incorrect ou une régression reproductible.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Merci de ne publier aucune donnée personnelle, adresse e-mail ou réponse détaillée au questionnaire.
  - type: textarea
    id: summary
    attributes:
      label: Problème observé
      description: Que s’est-il passé ?
      placeholder: Décrivez le problème en une ou deux phrases.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Appareil principal
      options:
        - Mobile
        - Ordinateur
        - Tablette
        - Plusieurs appareils
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navigateur et version
      placeholder: Firefox 148, Safari 20, Chrome 140…
  - type: textarea
    id: context
    attributes:
      label: Informations complémentaires
      description: Captures anonymisées, fréquence, éventuels messages d’erreur.
  - type: checkboxes
    id: privacy
    attributes:
      label: Vérification
      options:
        - label: J’ai retiré toute donnée personnelle de ce rapport.
          required: true
