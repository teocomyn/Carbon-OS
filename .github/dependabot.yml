version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: chore
    groups:
      framework:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react*"
        update-types:
          - minor
          - patch
      application-and-tests:
        patterns:
          - "*"
        exclude-patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
